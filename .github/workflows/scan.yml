name: Scan

on:
  workflow_call:

permissions:
  contents: read

jobs:
  scan:
    name: Scan for Unwanted Files
    runs-on: ubuntu-latest

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Scan Repository Files
        run: python .github/scripts/scan.py
