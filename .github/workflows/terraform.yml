name: Provision AWS Infrastructure

on:
  workflow_call:
    outputs:
      frontend_repository_url:
        description: Frontend ECR repository URL from applied Terraform state.
        value: ${{ jobs.provision.outputs.frontend_repository_url }}
      server_repository_url:
        description: Server ECR repository URL from applied Terraform state.
        value: ${{ jobs.provision.outputs.server_repository_url }}
      cognito_user_pool_id:
        description: Cognito user pool for the frontend build.
        value: ${{ jobs.provision.outputs.cognito_user_pool_id }}
      cognito_app_client_id:
        description: Cognito app client for the frontend build.
        value: ${{ jobs.provision.outputs.cognito_app_client_id }}
      aws_region:
        description: AWS region used by provisioning.
        value: ${{ jobs.provision.outputs.aws_region }}

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-west-2
  TF_IN_AUTOMATION: "true"

jobs:
  provision:
    outputs:
      frontend_repository_url: ${{ steps.outputs.outputs.frontend_repository_url }}
      server_repository_url: ${{ steps.outputs.outputs.server_repository_url }}
      cognito_user_pool_id: ${{ steps.outputs.outputs.cognito_user_pool_id }}
      cognito_app_client_id: ${{ steps.outputs.outputs.cognito_app_client_id }}
      aws_region: ${{ steps.outputs.outputs.aws_region }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4

      - name: Test Google Account Linking
        run: python3 -m unittest discover -s terraform/lambda -p 'test_*.py'

      - name: Set Up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.1
          terraform_wrapper: false

      - name: Display AWS Role To Assume
        run: 'echo "AWS role to assume: ${{ vars.AWS_ROLE_TO_ASSUME }}"'

      - name: Display GitHub OIDC Context
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Caller Identity
        run: aws sts get-caller-identity

      - name: Initialize Terraform
        working-directory: terraform
        run: terraform init -input=false

      - name: Check Terraform formatting
        working-directory: terraform
        run: terraform fmt -check -diff

      - name: Validate Terraform configuration
        working-directory: terraform
        run: terraform validate -no-color

      - name: Create Terraform plan
        working-directory: terraform
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Apply Terraform changes
        if: github.event_name == 'push'
        working-directory: terraform
        run: terraform apply -input=false -no-color tfplan

      - name: Export Applied Infrastructure Outputs
        id: outputs
        if: github.event_name == 'push'
        working-directory: terraform
        shell: bash
        run: |
          set -euo pipefail
          repository_urls=$(terraform output -json ecr_repository_urls)
          frontend_url=$(jq -er '.frontend | select(type == "string" and length > 0)' <<< "$repository_urls")
          server_url=$(jq -er '.server | select(type == "string" and length > 0)' <<< "$repository_urls")
          user_pool_id=$(terraform output -raw cognito_user_pool_id)
          client_id=$(terraform output -raw cognito_web_client_id)
          test -n "$user_pool_id"
          test -n "$client_id"
          echo "frontend_repository_url=$frontend_url" >> "$GITHUB_OUTPUT"
          echo "server_repository_url=$server_url" >> "$GITHUB_OUTPUT"
          echo "cognito_user_pool_id=$user_pool_id" >> "$GITHUB_OUTPUT"
          echo "cognito_app_client_id=$client_id" >> "$GITHUB_OUTPUT"
          echo "aws_region=$AWS_REGION" >> "$GITHUB_OUTPUT"
